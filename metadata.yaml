name: astrbot_plugin_proactive_companion
display_name: 主动陪伴
short_desc: 会主动找你说话的 AI 伙伴。
desc: |
  让 Bot 在**私聊和群聊中主动发起消息**的 AstrBot 插件。

  它不是定时刷屏机器人，而是有「记忆、有脾气、有分寸」的伙伴：会记住你说过什么，
  会因为你的语气变开心或低落，会看时间段办事，也能在你明确不想被打扰时闭嘴。

  **核心能力**

  - **主动消息**：后台定时巡检会话，在满足条件时主动开口，私聊与群聊均支持
  - **读空气**：自动判断群里气氛（冷清 / 正常 / 热闹 / 紧张），冷清时暖场、热闹时不抢话、
    气氛僵持时彻底闭嘴
  - **好感度**：记录 Bot 与每个人的长期关系（陌生 → 点头之交 → 熟人 → 亲近 → 挚友），
    关系越好越愿意主动搭话
  - **人物画像**：为每个用户建立可读档案（昵称、ID、好感、互动量、标签、备注），
    支持查看与手动修改，并把历史聊天记录回填进档案
  - **主动回复**：在机器人本来不会回复的消息上，按「回复概率」和白名单主动接话，
    走正常 LLM 链路，语气人设与被 @ 时完全一致
  - **上下文感知**：记录每个会话的近期对话，并结合 AstrBot 自身的会话历史生成话题
  - **持久化数据**：会话、消息、情绪、事件日志全部落盘到 `data/plugin_data/`，重装插件不丢数据
  - **动态情绪**：valence（愉悦度）/ arousal（唤醒度）双维度情绪，随互动漂移、随时间衰减，并影响语气与发言频率
  - **免打扰时段**：支持 `23:00-07:30` 这类跨午夜区间，静默期间绝不打扰
  - **TTS 集成**：可选用 AstrBot 的 TTS Provider，把主动消息转成语音
  - **独立 WebUI**：插件自带可视化面板，可管理会话、情绪、配置与日志

  **指令**：`/陪伴 开启`、`/陪伴 关闭`、`/陪伴 状态`、`/陪伴 好感`、`/陪伴 画像`、
  `/陪伴 改画像`、`/陪伴 重建画像`、`/陪伴 清除记忆`、`/陪伴 说说`、`/陪伴 诊断`、`/陪伴 清空`
  （指令仅限管理员使用，普通成员触发时会收到权限不足提示）

  **v1.2.1 更新说明**

  - **修复群聊「All chat models failed」**：插件会把群聊近期对话补进模型请求，一旦其中
    一句被网关判为敏感，之后**每一次**带上它的请求都会被拦，群里就再也回不上话。
    - 新增**上下文注入护栏**：可配置屏蔽词（命中整条丢弃）、单条消息长度上限、
      注入总长度上限，超长内容自动截断。
    - 新增**自动熔断**：一旦捕捉到 `All chat models failed` / `sensitive` 这类拦截错误，
      自动停止该会话的上下文注入，群里立刻恢复正常，不再连锁失败。
    - 新增指令 `/陪伴 上下文`（查看状态 / `暂停` / `恢复`），也可在面板一键关闭注入。
    - 原始聊天记录不会被删除，随时可以 `/陪伴 上下文 恢复` 重新开启。

  **v1.2.0 更新说明**

  - **私聊也有白名单了**：新增「私聊主动搭话白名单」配置。
    - 留空 = 不限制（保持 v1.1.0 的行为，任何人的私聊都可以被主动搭话）。
    - 填上具体值后，只有命中的人的私聊才会被主动搭话，其他人的私聊保持安静。
    - 可填用户 ID / 昵称 / 会话 ID；昵称取最新昵称，改了昵称也不会失效；填 `*` 表示不限制。
    - 群聊完全不受影响 —— 白名单只作用于私聊主动搭话。

  **v1.1.0 更新说明**

  - **私聊更主动**：私聊有独立的一套阈值，默认比群里积极得多，群里行为完全不变。
    - 静默多久才主动开口：群聊 45 分钟 → **私聊 15 分钟**
    - 两次主动发言最小间隔：群聊 180 分钟 → **私聊 60 分钟**
    - 每日主动消息上限：群聊 6 条 → **私聊 10 条**
  - **私聊不再被群聊的气氛规则卡住**（「冷清/热闹/紧张」是按多人聊天设计的，
    用在两人私聊上容易误伤，比如对方一句气话被判成「紧张」后 Bot 彻底闭嘴）。
  - **私聊有专属免打扰时段**，可以只让私聊在深夜安静，群里照旧。
  - **私聊优先发言**：每轮名额有限时优先给等着回话的私聊会话。
  - 私聊阈值都能在面板「配置」页调整，**填 0 / 留空即回退到全局设置**。
  - `/陪伴 状态` 现在显示当前场景实际生效的阈值；私聊提示词也改得更口语化。

  **v1.0.9 更新说明**

  - **新增「一键清除记忆」**（指令 + 面板按钮），四种范围随便挑，执行即生效、不需要二次确认：
    - `/陪伴 清除记忆` —— 清空**当前会话**的记忆：聊天记录、画像、情绪与气氛。
    - `/陪伴 清除记忆 <昵称或ID>` —— **忘掉某个人**：删掉他的画像、好感度与他说过的话。
    - `/陪伴 清除记忆 全部` —— 清空**所有会话**的记忆。
    - `/陪伴 清除记忆 画像 <昵称或ID>` / `/陪伴 清除记忆 画像 全部` —— **只清画像**与好感度，
      聊天记录保留。
  - **面板新增入口**：会话列表每行「清记忆」、画像卡片「遗忘此人」、画像页「只清画像」
    与「清空全部记忆」（后者有一次浏览器确认，防止误点）。
  - **`/陪伴 清空` 现在真正清记忆**：以前只重置情绪、聊天记录和画像都还在；
    现在与「清除记忆」一致（当前会话范围）。
  - 清除后会自动同步清理内存中的好感度缓存，不会出现「删了还残留」的旧分数。
  - **修复：机器人总是叫别人「亲爱的」，改了昵称也不改**。原因是插件生成主动消息时
    根本没把对方昵称告诉模型，模型只好自己挑称呼。现在：
    - 上下文里会带上对方昵称（私聊是对方本人，群聊是最近说话的那位）；
    - 用户改了昵称后，历史消息里的旧名字会统一替换成新名字，不会新旧两个名字混在一起；
    - 提示词里明确要求用昵称称呼对方，不要用「亲爱的」「宝贝」这类泛称。
  - 画像里的昵称可以**留空 = 恢复跟随平台昵称**（面板里清空昵称保存即可）。
  - 换了新图标。

  **v1.0.8 更新说明**

  - **修复：改画像「不生效」**。画像此前按「会话 + 用户」各存一份：同一个人同时在群聊和私聊
    里聊天就有多份画像，面板改的是其中一份，看起来就像没生效。现在画像**按人合并**，
    保存时**同步写入该用户的所有会话**，改哪一份都会一起生效；此前没有画像行的人
    也会自动补建一份，不再直接报错。
  - **保存后回读校验**：面板保存后会重新读库确认，把真正落库的值（昵称/标签/备注/好感度）
    和同步到的会话数显示出来，而不是只弹一句「已保存」。
  - **面板「画像」页签改成卡片式**，信息更全：好感等级与进度条、**一句话人物速写**、
    标签、**互动概况**（消息数 / 机器人回应次数 / 回应率 / 活跃会话数）、备注、
    **最近说过的话（聊天足迹）**。
  - **指令输出更详细**：`/陪伴 画像` 现在会显示互动概况、回应率与人物速写；
    `/陪伴 改画像` 会提示已同步到几个会话。
  - **`/陪伴 诊断` 新增画像诊断**：显示插件版本、数据库文件路径、画像行数/人数，
    以及你自己画像的原始字段（昵称 / 标签 / 备注 / 好感度 / 是否手动设置昵称），
    方便核对「改了到底写没写进去」。

  **v1.0.7 更新说明**

  - **指令仅限管理员使用**：`/陪伴` 指令组下的全部子指令都加了管理员权限校验，
    非管理员触发时框架会回复「权限不足以使用此指令」，不会误伤普通成员的聊天。

  - **修复：`/陪伴 好感`、`/陪伴 画像`、`/陪伴 改画像` 没反应**。原因是 AstrBot 的指令组
    不会把子指令名从消息里剥掉，插件按「第二个词」取参数时取到的其实是子指令名本身。
    现在改为按子指令名（含别名）定位并截取其后的参数，指令可以正常生效。
  - **修复：改完画像不生效**。手动修改的昵称不再被后续互动用平台昵称覆盖；
    好感度改为以数据库为准，手动设定的数值立刻可见；跨会话查找目标用户时也能改到。
  - **修复：画像里没有之前的聊天记录**。插件启动时（也可用 `/陪伴 重建画像` 手动触发）
    会用历史聊天记录回填画像——消息条数、首次/最近出现时间、机器人回应次数，
    并据此给历史用户估算初始好感度；画像里还会列出这个人最近说过的话。
  - 画像与好感指令支持用**昵称**指人（不只是在当前会话里按用户 ID 找）。
  - 数据库自动迁移：新增 `user_profiles.nickname_manual` 字段，升级不丢数据。

  **v1.0.6 更新说明**

  - **新增好感度**：记录 Bot 与每个用户的长期关系，分为
    陌生 / 点头之交 / 熟人 / 亲近 / 挚友 五档。互动、机器人回应、主动搭话都会加分，
    负面情绪扣分，长期不互动会缓慢衰减；关系越好，越愿意主动搭话，
    生成的回复也会带上合适的关系语气。
  - **新增人物画像**：为每个用户建立可读档案——昵称、用户 ID、好感等级、消息量、
    首次/最近出现、标签与备注，并支持手动修改。
  - **新增指令**：`/陪伴 好感`（查看好感度）、`/陪伴 画像`（查看画像）、
    `/陪伴 改画像 <用户ID> 备注=xxx 标签=a,b 好感=60`（修改画像）。
  - **新增 WebUI「画像」页签**：一览所有人的好感与画像，可在线编辑昵称、标签、备注、
    好感度。
  - 数据库自动迁移：新增 `user_profiles` 表，升级不丢数据。

  **v1.0.5 更新说明**

  - **修复：有人 @ 别人时机器人也会插话**。现在会识别消息里的 @ 目标，
    发现被 @ 的是别人（而不是机器人）时主动让位，绝不抢话。
  - **修复：认不清用户**。消息记录同时保存**昵称**和**用户 ID**；
    同一会话里出现同名用户时，注入模型的上下文会自动带上 ID 片段（如 `小明#0001`）
    以区分不同的人；气氛统计的「参与人数」也改为按用户 ID 计算。
  - WebUI 消息记录里可以同时看到昵称与用户 ID。

  **v1.0.4 更新说明**

  - **修复：保存插件配置报「错误的类型 proactive_reply_whitelist：期望是 list，得到了 str」**。
    原因是可视化面板把「主动回复白名单」按字符串写回配置，而 schema 声明的是 list。
    现在面板按 list 提交，保存接口也会按 schema 自动规整类型。
  - **新增配置自愈**：插件加载时会自动把历史遗留的类型不符配置（例如字符串形式的 list）
    修正并落盘，升级后无需手动清理。
  - 修正打包脚本：交付 zip 不再包含 `.git`、`__pycache__` 等非发布内容。

  **v1.0.3 更新说明**

  - **新增「读空气」**：根据会话最近的发言算出气氛等级——冷清 / 正常 / 热闹 / 紧张，
    并据此调整行为：冷清时主动暖场（概率放大、允许更早开口）、热闹时大幅降低插嘴概率、
    出现争执或攻击性措辞时彻底闭嘴。判断依据包含发言频率、参与人数、情绪倾向和冲突密度。
  - 气氛会写进提示词，机器人知道「现在群里什么气氛」，接话更合时宜。
  - WebUI 会话列表新增「气氛」列，概览新增气氛分布统计；`/陪伴 诊断` 也会显示气氛。
  - 新增配置：`atmosphere_enabled`、`atmosphere_window_minutes`、`atmosphere_refresh_minutes`、
    `atmosphere_cold_rate`、`atmosphere_hot_rate`、`atmosphere_conflict_ratio`、`atmosphere_boost`。

  **v1.0.2 更新说明**

  - 修复：主动回复一直不触发——原判定用了 `is_wake`，而 AstrBot 里任何插件的监听器
    通过过滤器都会把它置 True，导致主动回复每次都被自己挡掉；现改用
    `is_at_or_wake_command` 判断「机器人本来会不会回复」。
  - 修复：主动回复看不到上下文——AstrBot 的会话历史只含机器人参与过的对话，群里其他人
    聊天并不在内；现在插件会在后台被动采集会话消息，并在主动回复时把最近对话作为
    **临时上下文**注入本次 LLM 请求（不写入会话历史）。
  - 白名单语义调整：留空 = 不限制；`proactive_reply_enabled` 默认开启，概率默认 0.2。
  - 新增 `/陪伴 诊断` 指令与面板「最近判定 / 跳过原因」，几秒内可定位为什么没触发。
version: 1.2.1
author: hongdougao111
repo: https://github.com/hongdougao111/astrbot_plugin_proactive_companion
social_link: https://github.com/hongdougao111
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - lark
  - kook
  - slack
  - satori
tags:
  - proactive
  - companion
  - chat
  - mood
  - tts
  - dashboard
views:
  - name: panel
    description: 主动陪伴的可视化控制面板
